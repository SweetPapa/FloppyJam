<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- a cue ball under a neon light: the whole brief in 16 lines -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#5cf0b0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5cf0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="30%" y1="18%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c2d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07070f"/>
  <circle cx="32" cy="30" r="26" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="15" fill="url(#ball)"/>
  <circle cx="32" cy="26" r="4.2" fill="#ff5ca8"/>
  <ellipse cx="27" cy="26" rx="3.6" ry="2.4" fill="#fff" opacity=".85"/>
  <rect x="6" y="52" width="52" height="2.6" rx="1.3" fill="#5cf0b0"/>
</svg>
