<!doctype html>
<!-- VOLLEYBAR — the web shell (§0). Static hosting, two pads, nothing else.
     Drop index.html/.js/.wasm on itch.io or GitHub Pages and it runs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VOLLEYBAR</title>
<style>
  html,body { margin:0; padding:0; height:100%; background:#05070c; overflow:hidden;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#e8eef8; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center;
          justify-content:center; }
  canvas.emscripten { display:block; width:100%; height:100%; image-rendering:auto;
                      background:#05070c; outline:none; }
  #gate { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; cursor:pointer;
          background:radial-gradient(60% 60% at 50% 45%,#0d1424 0%,#05070c 100%);
          z-index:5; }
  #gate h1 { margin:0; font-size:clamp(28px,7vw,72px); letter-spacing:.14em; }
  #gate p  { margin:0; color:#8892a6; font-size:14px; letter-spacing:.10em; }
  #gate .go { margin-top:10px; padding:12px 26px; border:1px solid #46536e;
              border-radius:6px; letter-spacing:.16em; }
  #err { position:absolute; bottom:8px; left:8px; color:#c05; font-size:12px; }
</style>
</head>
<body>
<div id="wrap"><canvas class="emscripten" id="canvas" tabindex="-1"
     oncontextmenu="event.preventDefault()"></canvas></div>

<!-- The browser will not open an audio device until the player has touched
     something, so the game does not start until they have. One gesture, and
     the synth comes up with everything else. -->
<div id="gate">
  <h1>VOLLEYBAR</h1>
  <p>SIX RODS. ONE COMET. NO SPINNING.</p>
  <div class="go">CLICK TO PLAY</div>
  <p style="margin-top:18px">GAMEPADS RECOMMENDED &nbsp;·&nbsp; KEYBOARD: W/S + F &nbsp;·&nbsp; ARROWS + RSHIFT</p>
</div>
<div id="err"></div>

<script>
  var canvas = document.getElementById('canvas');
  var gate = document.getElementById('gate');
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function () {},
    onRuntimeInitialized: function () { gate.querySelector('.go').textContent = 'CLICK TO PLAY'; }
  };
  function start() {
    gate.style.display = 'none';
    canvas.focus();
  }
  gate.addEventListener('click', start);
  gate.addEventListener('touchstart', start, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (gate.style.display !== 'none') start();
    // the game owns these keys; the page must not scroll under it
    if ([32,37,38,39,40].indexOf(e.keyCode) >= 0) e.preventDefault();
  });
  window.onerror = function (m) {
    document.getElementById('err').textContent = m;
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
