name: MagLava Apple beta archives
on:
  workflow_dispatch:
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Archive iOS and Mac Catalyst without credentials
        run: |
          xcodebuild -project mobile/ios/Maglava.xcodeproj -scheme Maglava -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Maglava-iOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          xcodebuild -project mobile/ios/Maglava.xcodeproj -scheme Maglava -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -archivePath "$RUNNER_TEMP/Maglava-macOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Maglava-iOS.xcarchive" "$RUNNER_TEMP/Maglava-iOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Maglava-macOS.xcarchive" "$RUNNER_TEMP/Maglava-macOS.zip"
      - name: Test on current iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project mobile/ios/Maglava.xcodeproj -scheme Maglava -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -resultBundlePath "$RUNNER_TEMP/Maglava-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maglava-apple-beta
          path: |
            ${{ runner.temp }}/Maglava-iOS.zip
            ${{ runner.temp }}/Maglava-macOS.zip
            ${{ runner.temp }}/Maglava-tests.xcresult
          retention-days: 14
